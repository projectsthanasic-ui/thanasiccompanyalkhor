<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <!-- Gold Metallic Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BF953F" />
      <stop offset="25%" stop-color="#FCF6BA" />
      <stop offset="50%" stop-color="#B38728" />
      <stop offset="75%" stop-color="#FBF5B7" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>

    <!-- Blue Metallic Gradient for Text -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3c72" />
      <stop offset="50%" stop-color="#2a5298" />
      <stop offset="100%" stop-color="#1e3c72" />
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    
    <!-- Subtle Glow for the Sparkle -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background (Optional: Remove this rect for transparent background) -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Main Logo Group -->
  <g filter="url(#dropShadow)">
    
    <!-- The Stylized 'T' Icon -->
    <g transform="translate(250, 130)">
      <!-- Outer Shape -->
      <path d="M -50 -60 L 50 -60 L 50 -20 L 20 -20 L 20 40 A 20 20 0 0 1 -20 40 L -20 -20 L -50 -20 Z" 
            fill="none" stroke="url(#goldGradient)" stroke-width="12" stroke-linejoin="round" />
      <!-- Inner Detail Line -->
      <path d="M -35 -45 L 35 -45 L 35 -20 L 10 -20 L 10 40 A 10 10 0 0 1 -10 40 L -10 -20 L -35 -20 Z" 
            fill="none" stroke="url(#goldGradient)" stroke-width="4" stroke-linejoin="round" opacity="0.8"/>
      
      <!-- Sparkle Effect on Top Left -->
      <path d="M -55 -65 L -45 -65 M -50 -70 L -50 -60" stroke="#fff" stroke-width="2" filter="url(#glow)"/>
      <circle cx="-50" cy="-65" r="3" fill="#fff" filter="url(#glow)"/>
    </g>

    <!-- "THANASIC" Text -->
    <text x="250" y="240" 
          font-family="'Times New Roman', Times, serif" 
          font-size="52" 
          font-weight="bold" 
          text-anchor="middle" 
          fill="url(#blueGradient)" 
          letter-spacing="2">
      THANASIC
    </text>

    <!-- Decorative Divider Line -->
    <line x1="120" y1="265" x2="380" y2="265" stroke="url(#goldGradient)" stroke-width="2" />
    <circle cx="250" cy="265" r="4" fill="url(#goldGradient)" />

    <!-- "COMPANY" Text -->
    <text x="250" y="305" 
          font-family="Arial, Helvetica, sans-serif" 
          font-size="22" 
          font-weight="normal" 
          text-anchor="middle" 
          fill="url(#goldGradient)" 
          letter-spacing="6">
      COMPANY
    </text>
    
  </g>
</svg>