<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 140" role="img" aria-labelledby="title desc">
  <title id="title">Thanasic Company Logo</title>
  <desc id="desc">Blue and gold logo for Thanasic Company AC and maintenance services</desc>
  <defs>
    <linearGradient id="goldGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#f3d279"/>
      <stop offset="100%" stop-color="#c89b2a"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#0d3d6b"/>
      <stop offset="100%" stop-color="#032a4d"/>
    </linearGradient>
  </defs>
  <rect width="420" height="140" rx="18" fill="#ffffff"/>
  <g transform="translate(16 18)">
    <rect x="0" y="0" width="104" height="104" rx="22" fill="url(#blueGrad)"/>
    <g transform="translate(18 16)">
      <rect x="9" y="20" width="56" height="40" rx="8" fill="none" stroke="url(#goldGrad)" stroke-width="6"/>
      <path d="M18 20 L18 8 L42 8" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
      <path d="M48 20 L48 8 L72 8" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
      <path d="M18 62 L32 78 L48 62" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="31" cy="40" r="8" fill="url(#goldGrad)"/>
    </g>
  </g>
  <g transform="translate(136 28)">
    <text x="0" y="38" font-size="32" font-family="Montserrat, Arial, sans-serif" font-weight="800" fill="#072f52">THANASIC</text>
    <text x="3" y="68" font-size="17" font-family="Open Sans, Arial, sans-serif" letter-spacing="3" fill="#c8992e" font-weight="700">COMPANY W.L.L.</text>
    <line x1="0" y1="82" x2="272" y2="82" stroke="#d4af37" stroke-width="4" stroke-linecap="round"/>
    <text x="3" y="108" font-size="15" font-family="Open Sans, Arial, sans-serif" fill="#3b4d61" font-weight="600">AC • ELECTRICAL • PLUMBING</text>
  </g>
</svg>
